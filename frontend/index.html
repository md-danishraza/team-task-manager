    <!-- Primary Meta Tags -->

      content="task manager, project management, team collaboration, kanban, productivity, software"
    />

    <!-- Canonical Link (Prevents duplicate content issues in Google) -->
    <link
      rel="canonical"
      href="https://team-task-manager-ethara.netlify.app/"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://team-task-manager-ethara.netlify.app/"
    />

    />
    <meta
      property="og:image"

    <!-- Dark Mode Flash Prevention Script -->
    <script>
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
